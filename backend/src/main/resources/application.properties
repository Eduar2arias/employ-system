spring.application.name=system-employ

# Nombre de la base de datos
# spring.datasource.url=jdbc:mysql://mysql:3310/proyecto_integracioncontinua
spring.datasource.url=jdbc:mysql://mysql:3306/proyecto_integracioncontinua?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Usuario y contraseña MySQL
spring.datasource.username=root
spring.datasource.password=root

# Driver de conexión
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mostrar las consultas SQL en consola
spring.jpa.properties.hibernate.format_sql=true

# (Opcional) Mostrar valores reales de los parámetros
logging.level.org.hibernate.type.descriptor.sql=TRACE


server.port=8080